[project]
name = "atlas-torch"
version = "0.1.0"
description = "Open-source implementation of Atlas (Behrouz et al. 2025), built on lucidrains' titans-pytorch"
authors = [
    { name = "Phil Wang", email = "lucidrains@gmail.com" },
    { name = "Daniel Quintas", email = "daniel.quintas.lopes@gmail.com" }
]
readme = "README.md"
requires-python = ">= 3.9"
license = { file = "LICENSE" }
keywords = [
    'artificial intelligence',
    'deep learning',
    'test time training',
    'linear attention',
    'memory',
]

classifiers=[
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'Topic :: Scientific/Engineering :: Artificial Intelligence',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.9',
]

dependencies = [
    "assoc-scan>=0.0.4",
    "axial_positional_embedding>=0.3.10",
    "einops>=0.8.0",
    "einx>=0.3.0",
    "hyper-connections>=0.3.11",
    "Ninja",
    "rotary-embedding-torch",
    "tensordict",
    "torch>=2.5",
    "tqdm",
    "x-transformers"
]

[project.urls]
Homepage = "https://github.com/danielquintas8/atlas-torch"
Repository = "https://github.com/danielquintas8/atlas-torch"
Upstream = "https://github.com/lucidrains/titans-pytorch"

[project.optional-dependencies]

examples = [
    "adam-atan2-pytorch>=0.1.18",
    "wandb"
]

test = [
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["titans_pytorch"]
